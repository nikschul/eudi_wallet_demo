services:
  app:
    build: .
    image: eudi-wallet-demo:local
    restart: unless-stopped
    init: true
    user: node
    environment:
      APP_ROLE: workshop
      PORT: "3000"
      HOST_PORT: ${PORT:-3000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-3000}}
      VERIFIER_NAME: ${VERIFIER_NAME:-Fraunhofer ISST – Empfang}
      EVENT_TITLE: ${EVENT_TITLE:-EUDI Wallet Workshop}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - workshop-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  workshop-data:
