name: eudi-hosted

services:
  app:
    image: ${DEMO_IMAGE:-ghcr.io/nikschul/eudi_wallet_demo:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: node
    environment:
      PORT: "3000"
      HOST_PORT: ${PORT:-3000}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL auf die zentrale oeffentliche HTTPS-Adresse setzen}
      DATA_DIR: /app/data
      VERIFIER_NAME: ${VERIFIER_NAME:-Check-In}
      EVENT_TITLE: ${EVENT_TITLE:-Wallet & Check-In}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - hosted-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  hosted-data:
