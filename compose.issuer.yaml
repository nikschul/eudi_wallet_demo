services:
  app:
    build: .
    image: eudi-wallet-demo:local
    restart: unless-stopped
    init: true
    user: node
    environment:
      APP_ROLE: issuer
      PORT: "3000"
      HOST_PORT: ${PORT:-3001}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-3001}}
      WORKSHOP_URL: ${WORKSHOP_URL:?WORKSHOP_URL muss die zentrale oeffentliche HTTPS-Adresse sein}
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"
    volumes:
      - issuer-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  issuer-data:
